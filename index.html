/* --------------------------------------------------------- PURE HELPERS */
function manwon(amountWon) {
  return Math.round(amountWon / 10000) + "만원";
}
function manwonGain(amountWon) {
  return manwon(Math.max(0, amountWon));
}
function won(amountWon) {
  return amountWon.toLocaleString("ko-KR") + "원";
}
function normalizeName(name) {
  return (name || "").replace(/\s+/g, "");
}
function findCodesByName(name) {
  const norm = normalizeName(name);
  if (!norm) return [];
  return ROSTER.filter((p) => normalizeName(p.name) === norm).map((p) => p.code);
}

/* ---------------------------------------------------------- CALCULATORS */
function calculateGiftSmall(perf) {
  const achieved = perf >= AWARD_CONFIG.giftSmall.minPerf;
  return { achieved, item: AWARD_CONFIG.giftSmall.item, icon: AWARD_CONFIG.giftSmall.icon };
}

function calculateGiftTier(perf) {
  for (const t of AWARD_CONFIG.giftTiers) {
    if (perf >= t.min) return { achieved: true, min: t.min, itemA: t.itemA, itemB: t.itemB, icon: t.icon };
  }
  return { achieved: false, min: null, itemA: null, itemB: null, icon: null };
}

/* 확정된 규칙 (2026-08 확인):
   이 구간의 정액 ÷ 총실적 = "실질 지급률"
   기타실적 × 실질지급률 + 주력상품실적 × 100%
   → 30만원 이상 구간(달성금액의 80%)도 같은 원리(실질 지급률=0.8, 상수)라 하나의 공식으로 통일 */
function calculateBasicAward(perf, mainProductPerf, isOverride) {
  const mpPerf = Math.min(mainProductPerf || 0, perf);
  const otherPerf = perf - mpPerf;

  if (isOverride) {
    return { amount: Math.round(perf * AWARD_CONFIG.basicOverrideRate), mode: "override", mainPortion: null, otherPortion: null };
  }
  if (perf < 50000) {
    return { amount: 0, mode: "none", mainPortion: null, otherPortion: null };
  }

  let impliedRate;
  let mode;
  if (perf >= AWARD_CONFIG.basicTopMin) {
    impliedRate = AWARD_CONFIG.basicTopRateOther; // 30만원 이상: 정의상 항상 80%
    mode = "top";
  } else {
    const tier = AWARD_CONFIG.basicFixedTiers.find((t) => perf >= t.min && perf < t.max);
    const fixedAmount = tier ? tier.amount : 0;
    impliedRate = fixedAmount / perf; // 이 구간의 정액을 총실적으로 나눈 실질 지급률
    mode = "fixed";
  }

  const mainAmt = Math.round(mpPerf * AWARD_CONFIG.basicTopRateMain); // 주력상품은 항상 100%
  const otherAmt = Math.round(otherPerf * impliedRate);
  return { amount: mainAmt + otherAmt, mode, mainPortion: mainAmt, otherPortion: otherAmt };
}

function calculateHighcapBridge(julyTier, perf) {
  if (!julyTier) return { eligible: false, achieved: false, amount: 0, gap: 0, julyTier: null };
  const amount = AWARD_CONFIG.highcapBridgeAmounts[julyTier] || 0;
  const achieved = perf >= AWARD_CONFIG.highcapAugustMin;
  const gap = achieved ? 0 : AWARD_CONFIG.highcapAugustMin - perf;
  return { eligible: true, achieved, amount, gap, julyTier };
}

function calculateAmchiAward(preRegistered, amchiPerf) {
  const tiers = preRegistered ? AWARD_CONFIG.amchiTiersRegistered : AWARD_CONFIG.amchiTiersNotRegistered;
  for (const t of tiers) {
    if (amchiPerf >= t.min && (t.max === undefined || amchiPerf < t.max)) {
      return { amount: t.amount, tierMin: t.min };
    }
  }
  return { amount: 0, tierMin: null };
}

function calculateNextGoal(perf, mainProductPerf, isOverride) {
  if (isOverride) return null;
  const nextBound = BASIC_TIER_BOUNDS.find((b) => b > perf);
  if (!nextBound) return null;
  const gap = nextBound - perf;
  const current = calculateBasicAward(perf, mainProductPerf, false).amount;
  const projected = calculateBasicAward(nextBound, mainProductPerf, false).amount;
  return { targetTier: nextBound, gap, currentAmount: current, projectedAmount: projected, delta: projected - current };
}

/* --------------------------------------------------------- ORCHESTRATOR */
function computeAll(name, code, perf, mainProductPerf, isOverride, amchiRegistered, amchiPerf) {
  const julyTier = HIGHCAP_JULY[code] || null;

  const giftSmall = calculateGiftSmall(perf);
  const giftTier = calculateGiftTier(perf);
  const basic = calculateBasicAward(perf, mainProductPerf, isOverride);
  const highcap = calculateHighcapBridge(julyTier, perf);
  const amchi = calculateAmchiAward(amchiRegistered, amchiPerf);
  const nextGoal = calculateNextGoal(perf, mainProductPerf, isOverride);

  const securedTotal = basic.amount + (highcap.achieved ? highcap.amount : 0) + amchi.amount;
  const pendingBridgeTotal = highcap.eligible && !highcap.achieved ? highcap.amount : 0;

  return {
    name,
    perf,
    mainProductPerf,
    isOverride,
    amchiRegistered,
    amchiPerf,
    julyTier,
    giftSmall,
    giftTier,
    basic,
    highcap,
    amchi,
    nextGoal,
    securedTotal,
    pendingBridgeTotal,
  };
}

function TierGauge({ perf }) {
  const boundaries = [0, 50000, 100000, 200000, 300000];
  const labels = ["5만", "10만", "20만", "30만+"];
  const capPerf = Math.min(perf, 300000);
  const segments = [];
  for (let i = 0; i < boundaries.length - 1; i++) {
    const start = boundaries[i];
    const end = boundaries[i + 1];
    const fillFrac = Math.max(0, Math.min(1, (capPerf - start) / (end - start)));
    segments.push({ fillFrac });
  }
  return (
    <div className="kb-gauge">
      <div className="kb-gauge__track">
        {segments.map((s, i) => (
          <div className="kb-gauge__seg" key={i}>
            <div className="kb-gauge__fill" style={{ width: s.fillFrac * 100 + "%" }} />
          </div>
        ))}
      </div>
      <div className="kb-gauge__labels">
        {labels.map((l, i) => (
          <span key={i}>{l}</span>
        ))}
      </div>
    </div>
  );
}

function getAmchiNudge(amchiRegistered) {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const deadline = new Date(2026, 7, 11); // 8/11(화) 사전예약활동 마감
  if (today > deadline) return null;
  if (amchiRegistered) {
    return "화요일(11일)까지가 비암치플랜 사전예약활동 기간이에요. 이미 참여하셨네요, 감사해요!";
  }
  return "화요일(11일)까지 비암치플랜 사전예약활동(가입설계)에 참여하시면 특별시상 금액이 더 커져요. 아직이시라면 서둘러보세요!";
}

function buildCoachMessage(result) {
  const { name, nextGoal, securedTotal, isOverride, amchiRegistered } = result;
  const nudge = getAmchiNudge(amchiRegistered);

  if (isOverride) {
    return {
      main: `${name}님, 이번 달 100만원 이상(또는 당월 위촉)으로 실적 전체가 100% 인정돼요!`,
      detail: `지금까지 확보하신 시상금은 ${won(securedTotal)}이에요.`,
      nudge,
    };
  }
  if (!nextGoal) {
    return {
      main: `${name}님, 이미 30만원 구간을 넘으셨어요!`,
      detail: `지금까지 확보하신 시상금은 ${won(securedTotal)}이에요.`,
      nudge,
    };
  }
  return {
    main: `${name}님, ${manwon(nextGoal.targetTier)} 구간까지 ${won(nextGoal.gap)} 남았어요.`,
    detail: `여기까지 채우시면 기본시상이 ${manwonGain(nextGoal.delta)}이 더 늘어나요.`,
    nudge,
  };
}

/* --------------------------------------------------- SHARE IMAGE (canvas) */
function roundRectPath(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function drawKangbugiOnCanvas(ctx, cx, cy, size) {
  try {
    const img = await loadImage(MASCOT_IMAGES.happy);
    const ratio = img.width / img.height;
    const h = size;
    const w = size * ratio;
    ctx.drawImage(img, cx - w / 2, cy - h / 2, w, h);
  } catch (e) {
    // 이미지 로드 실패 시 조용히 생략 (공유 이미지 생성 자체는 계속 진행)
  }
}

function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(" ");
  let line = "";
  let curY = y;
  for (let i = 0; i < words.length; i++) {
    const test = line + words[i] + " ";
    if (ctx.measureText(test).width > maxWidth && line !== "") {
      ctx.fillText(line.trim(), x, curY);
      line = words[i] + " ";
      curY += lineHeight;
    } else {
      line = test;
    }
  }
  ctx.fillText(line.trim(), x, curY);
  return curY;
}

async function generateShareImage(result) {
  const { name, securedTotal, basic, highcap, amchi, giftSmall, giftTier } = result;
  const items = [];
  if (basic.amount > 0) items.push({ label: "💰 기본시상", amount: basic.amount });
  if (highcap.achieved) items.push({ label: "🌉 고하이캡 브릿지", amount: highcap.amount, note: "내년 지급" });
  if (amchi.amount > 0) items.push({ label: "🩺 비암치플랜 특별시상", amount: amchi.amount });

  const gifts = [];
  if (giftSmall.achieved) gifts.push(giftSmall.item);
  if (giftTier.achieved) gifts.push(`${manwon(giftTier.min)} 구간 택1 (${giftTier.itemA} 또는 ${giftTier.itemB})`);

  try {
    if (document.fonts) {
      await Promise.all([
        document.fonts.load('900 34px "Noto Sans KR"'),
        document.fonts.load('800 16px "Noto Sans KR"'),
        document.fonts.load('700 15px "Noto Sans KR"'),
        document.fonts.load('500 10px "Noto Sans KR"'),
      ]);
    }
  } catch (e) {}

  const W = 360;
  const scale = 3;
  const pad = 26;
  const itemRowH = 34;
  const listH = items.length ? items.length * itemRowH + 10 : 40;
  const giftH = gifts.length ? gifts.length * 20 + 30 : 0;
  const H = pad + 70 + 44 + 62 + 24 + listH + (giftH ? giftH + 10 : 0) + 24 + 50 + pad;

  const canvas = document.createElement("canvas");
  canvas.width = W * scale;
  canvas.height = H * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);

  ctx.fillStyle = "#FFF8F0";
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "#ECE7DF";
  ctx.lineWidth = 1;
  roundRectPath(ctx, 0.5, 0.5, W - 1, H - 1, 20);
  ctx.stroke();

  let y = pad;
  await drawKangbugiOnCanvas(ctx, pad + 22, y + 20, 46);
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#C6501A";
  ctx.font = "900 21px 'Noto Sans KR'";
  ctx.fillText("강북이", pad + 52, y + 18);
  ctx.fillStyle = "#8A8580";
  ctx.font = "600 12px 'Noto Sans KR'";
  ctx.fillText("강북지역단 8월 2주차 시상 가이드", pad + 52, y + 36);

  y += 70;
  ctx.fillStyle = "#2B2A28";
  ctx.font = "700 15px 'Noto Sans KR'";
  ctx.fillText(name + "님, 지금 확보하신 예상 시상금은", pad, y);

  y += 44;
  ctx.fillStyle = "#C6501A";
  ctx.font = "900 32px 'Noto Sans KR'";
  ctx.fillText(securedTotal.toLocaleString("ko-KR") + "원", pad, y);

  y += 18;
  ctx.strokeStyle = "#ECE7DF";
  ctx.beginPath();
  ctx.moveTo(pad, y);
  ctx.lineTo(W - pad, y);
  ctx.stroke();

  y += 26;
  if (items.length === 0) {
    ctx.fillStyle = "#8A8580";
    ctx.font = "600 14px 'Noto Sans KR'";
    ctx.textAlign = "left";
    ctx.fillText("아직 확보한 시상이 없어요", pad, y);
    y += itemRowH;
  } else {
    items.forEach((it) => {
      ctx.textAlign = "left";
      ctx.fillStyle = "#2B2A28";
      ctx.font = "700 15px 'Noto Sans KR'";
      ctx.fillText(it.label, pad, y);
      ctx.textAlign = "right";
      ctx.font = "800 15px 'Noto Sans KR'";
      ctx.fillStyle = "#C6501A";
      const amtText = Math.round(it.amount / 10000) + "만원";
      ctx.fillText(amtText, W - pad, y);
      if (it.note) {
        const amtW = ctx.measureText(amtText).width;
        ctx.font = "700 10px 'Noto Sans KR'";
        ctx.fillStyle = "#8A8580";
        ctx.fillText(it.note, W - pad - amtW - 10, y);
      }
      y += itemRowH;
    });
  }

  if (gifts.length) {
    y += 6;
    ctx.textAlign = "left";
    ctx.fillStyle = "#8A8580";
    ctx.font = "700 11px 'Noto Sans KR'";
    ctx.fillText("사은품", pad, y);
    y += 18;
    gifts.forEach((g) => {
      ctx.fillStyle = "#2B2A28";
      ctx.font = "500 11px 'Noto Sans KR'";
      y = wrapCanvasText(ctx, "· " + g, pad, y, W - pad * 2, 15);
      y += 15;
    });
  }

  y += 4;
  ctx.strokeStyle = "#ECE7DF";
  ctx.beginPath();
  ctx.moveTo(pad, y);
  ctx.lineTo(W - pad, y);
  ctx.stroke();

  y += 22;
  ctx.fillStyle = "#B3AEA8";
  ctx.font = "500 10px 'Noto Sans KR'";
  ctx.textAlign = "left";
  wrapCanvasText(
    ctx,
    "※ 강북이는 입력하신 실적과 시상 기준을 바탕으로 예상 금액을 안내하는 서비스입니다. 실제 시상금은 최종 실적 및 시상 기준 적용 결과에 따라 달라질 수 있습니다.",
    pad,
    y,
    W - pad * 2,
    14
  );

  return new Promise((resolve) => {
    canvas.toBlob((blob) => resolve(blob), "image/png");
  });
}

        a.download = `강북이_시상_${name}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        track("image_save", { method: "download" });
      }
    } catch (e) {
    } finally {
      setSaving(false);
    }
  }

  async function handleKakaoShare() {
    track("kakao_share_click");
    const shareData = {
      title: "강북이 | 8월 2주차 시상 가이드",
      text: "이번 주 예상 시상금, 강북이한테 바로 확인해보세요!",
      url: window.location.href,
    };
    try {
      if (navigator.share) {
        await navigator.share(shareData);
        track("kakao_share_result", { method: "native_share" });
        track("service_share", { method: "native_share" });
        return;
      }
    } catch (e) {
      /* 사용자가 공유를 취소한 경우 등 — 아래 복사 방식으로 넘어가지 않고 조용히 종료 */
      track("kakao_share_result", { method: "cancelled" });
      return;
    }
    try {
      await navigator.clipboard.writeText(shareData.url);
      track("kakao_share_result", { method: "clipboard_fallback" });
      track("service_share", { method: "clipboard_fallback" });
      alert("링크가 복사됐어요! 카톡에 붙여넣기 해서 공유해보세요.");
    } catch (e) {
      const textarea = document.createElement("textarea");
      textarea.value = shareData.url;
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand("copy");
        track("kakao_share_result", { method: "execcommand_fallback" });
        track("service_share", { method: "execcommand_fallback" });
        alert("링크가 복사됐어요! 카톡에 붙여넣기 해서 공유해보세요.");
      } catch (e2) {
        alert(shareData.url);
      }
      document.body.removeChild(textarea);
    }
  }

      {/* 실적 구간 게이지 */}
      <div className="kb-card">
        <SectionTitle>{result.name}님의 실적 구간</SectionTitle>
        <TierGauge perf={result.perf} />

      {/* 강북이의 추천 */}

/* =========================================================================
   APP ROOT
   ========================================================================= */
function KangbukApp() {
  const [screen, setScreen] = useState("input"); // 'input' | 'result' | 'gallery'
  const [posterKey, setPosterKey] = useState(null); // null | 'week1' | 'week2' | 'recruit'

  const [name, setName] = useState("");
  const [code, setCode] = useState("");
  const [perfInput, setPerfInput] = useState("");
  const [mainProductInput, setMainProductInput] = useState("");
  const [isOverride, setIsOverride] = useState(false);
  const [amchiRegistered, setAmchiRegistered] = useState(false);
  const [amchiPerfInput, setAmchiPerfInput] = useState("");

  useEffect(() => {
    window.scrollTo(0, 0);
  }, [screen]);

  useEffect(() => {
    if (posterKey) track("poster_view", { poster: posterKey });
  }, [posterKey]);

  const result = useMemo(() => {
    if (screen !== "result") return null;
    const perf = Number(perfInput.replace(/[^0-9]/g, "")) || 0;
    const mainProductPerf = Number(mainProductInput.replace(/[^0-9]/g, "")) || 0;
    const amchiPerf = Number(amchiPerfInput.replace(/[^0-9]/g, "")) || 0;

    const matches = findCodesByName(name);
    let resolvedCode = code.trim().toUpperCase();
    if (matches.length === 1) resolvedCode = matches[0];

    return computeAll(name.trim(), resolvedCode, perf, mainProductPerf, isOverride, amchiRegistered, amchiPerf);
  }, [screen, name, code, perfInput, mainProductInput, isOverride, amchiRegistered, amchiPerfInput]);

  function handleSubmit() {
    setScreen("result");
  }
  function handleRecalculate() {
    setScreen("input");
  }

  function getPosterFile(key) {
    if (key === "recruit") return RECRUIT_POSTER.file;
    if (POSTERS[key]) return POSTERS[key].file;
    return null;
  }

  return (
    <div className="kb-app">
      <style>{CSS}</style>
      {screen === "gallery" ? (
        <GalleryScreen onBack={() => setScreen("result")} onOpenPoster={(k) => setPosterKey(k)} />
      ) : screen === "input" || !result ? (
        <InputScreen
          name={name} setName={setName}
          code={code} setCode={setCode}
          perfInput={perfInput} setPerfInput={setPerfInput}
          mainProductInput={mainProductInput} setMainProductInput={setMainProductInput}
          isOverride={isOverride} setIsOverride={setIsOverride}
          amchiRegistered={amchiRegistered} setAmchiRegistered={setAmchiRegistered}
          amchiPerfInput={amchiPerfInput} setAmchiPerfInput={setAmchiPerfInput}
          onSubmit={handleSubmit}
        />
      ) : (
        <ResultScreen
          result={result}
          onRecalculate={handleRecalculate}
          onOpenGallery={() => setScreen("gallery")}
          onOpenPoster={(k) => setPosterKey(k)}
        />
      )}
      <PosterModal file={getPosterFile(posterKey)} onClose={() => setPosterKey(null)} />
    </div>
  );
}

.kb-breakdown-empty { color: #E6E1D8; font-size: 15px; margin: 10px 0 0; }

.kb-gifts { background: var(--kb-orange-soft); border: none; }
.kb-gift-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-top: 1px dashed rgba(198,80,26,0.25); }
.kb-gift-row:first-of-type { border-top: none; }
.kb-gift-row__icon { font-size: 26px; line-height: 1; }
.kb-gift-row__title { font-size: 13.5px; font-weight: 700; color: var(--kb-orange-dark); margin: 0 0 3px; }
.kb-gift-row__item { font-size: 15px; font-weight: 600; color: var(--kb-ink); margin: 0; line-height: 1.4; }
.kb-gift-row__or { color: var(--kb-gray); font-weight: 500; font-size: 13px; }

.kb-recommend { background: var(--kb-orange-soft); border: none; }
.kb-recommend__head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.kb-recommend__badge { font-size: 15px; font-weight: 800; color: var(--kb-orange-dark); background: rgba(255,255,255,0.6); padding: 4px 11px; border-radius: 999px; }
.kb-bubble { background: var(--kb-white); border-radius: 16px; padding: 16px; margin-top: 10px; position: relative; }
.kb-bubble__tail { position: absolute; top: -7px; left: 24px; width: 14px; height: 14px; background: var(--kb-white); transform: rotate(45deg); border-radius: 3px; }
.kb-bubble__coach { font-size: 16px; color: var(--kb-ink); margin: 0; line-height: 1.6; font-weight: 500; }
.kb-bubble__nudge { font-size: 14px; color: var(--kb-orange-dark); margin: 10px 0 0; padding-top: 10px; border-top: 1px dashed var(--kb-gray-light); line-height: 1.55; font-weight: 600; }

.kb-gauge__track { display: flex; gap: 4px; height: 14px; }
.kb-gauge__seg { flex: 1; background: var(--kb-gray-light); border-radius: 8px; overflow: hidden; }
.kb-gauge__fill { height: 100%; background: var(--kb-orange); border-radius: 8px; }
.kb-gauge__labels { display: flex; justify-content: space-between; margin-top: 6px; }
.kb-gauge__labels span { font-size: 12px; color: var(--kb-gray); font-weight: 600; flex: 1; text-align: right; }

.kb-ad-banner { display: flex; align-items: center; gap: 10px; width: 100%; padding: 18px 20px; border-radius: 16px; border: none; background: linear-gradient(90deg, #FF7A29, #FF9557); color: var(--kb-white); font-family: inherit; cursor: pointer; }
.kb-ad-banner__gift { font-size: 22px; line-height: 1; }
.kb-ad-banner__text { font-size: 16px; font-weight: 800; flex: 1; text-align: left; }
.kb-ad-banner__arrow { font-size: 22px; font-weight: 700; }

.kb-feedback-banner { display: flex; align-items: center; gap: 12px; width: 100%; padding: 16px 18px; border-radius: 16px; border: 1.5px solid var(--kb-orange); background: var(--kb-orange-soft); font-family: inherit; cursor: pointer; text-align: left; }
.kb-feedback-banner__icon { font-size: 26px; line-height: 1; }
.kb-feedback-banner__text { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.kb-feedback-banner__text strong { font-size: 15.5px; color: var(--kb-orange-dark); font-weight: 800; }
.kb-feedback-banner__text span:last-child { font-size: 12.5px; color: var(--kb-gray); font-weight: 500; }
.kb-feedback-banner__arrow { font-size: 20px; color: var(--kb-orange-dark); font-weight: 700; }


.kb-section-title { display: flex; align-items: center; gap: 9px; font-size: 22px; font-weight: 900; letter-spacing: -0.3px; color: var(--kb-ink); margin: 0 0 14px; }
.kb-section-title__bar { display: inline-block; width: 5px; height: 20px; background: var(--kb-orange); border-radius: 3px; flex-shrink: 0; }

.kb-detail-card { background: var(--kb-white); border: 1px solid var(--kb-gray-light); border-radius: 16px; padding: 16px 18px; }
.kb-detail-card__head { display: flex; align-items: center; justify-content: space-between; font-size: 17px; font-weight: 800; margin-bottom: 8px; gap: 8px; }
.kb-detail-card__amount { font-size: 17px; font-weight: 900; display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.kb-detail-card__row { font-size: 15px; color: var(--kb-gray); margin: 3px 0 0; line-height: 1.5; }
.kb-detail-card__row--muted { color: var(--kb-orange-dark); font-weight: 500; }
.kb-detail-card__row--good { color: #4C8B5C; font-weight: 700; }

.kb-chip { display: inline-block; font-size: 12.5px; font-weight: 800; padding: 3px 9px; border-radius: 999px; }
.kb-chip--orange { background: var(--kb-orange); color: var(--kb-white); }
.kb-chip--muted { background: var(--kb-gray-light); color: var(--kb-gray); font-weight: 700; }

.kb-board__grid { display: grid; grid-template-columns: minmax(96px, auto) 1fr auto; column-gap: 10px; }
.kb-board__name, .kb-board__meta, .kb-board__amt { padding: 13px 0; border-bottom: 1px solid var(--kb-gray-light); }
.kb-board__grid > *:nth-last-child(-n+3) { border-bottom: none; }
.kb-board__name { font-size: 16px; font-weight: 700; text-align: left; }
.kb-board__meta { font-size: 14.5px; color: var(--kb-gray); text-align: left; }
.kb-board__amt { font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: flex-end; gap: 6px; white-space: nowrap; text-align: right; }
.kb-board__tag { font-size: 12px; font-weight: 700; color: var(--kb-gray); background: var(--kb-gray-light); padding: 2px 7px; border-radius: 999px; }
.kb-board__total { margin-top: 14px; padding-top: 14px; border-top: 2px solid var(--kb-ink); text-align: left; }
.kb-board__total-label { font-size: 15px; color: var(--kb-gray); font-weight: 600; margin: 0 0 4px; }
.kb-board__total-amt { font-size: 28px; font-weight: 900; margin: 0; color: var(--kb-orange-dark); font-variant-numeric: tabular-nums; }
.kb-board__pending { font-size: 14.5px; color: var(--kb-gray); margin: 8px 0 0; font-weight: 600; }

.kb-gallery-banner { width: 100%; padding: 15px 0; border-radius: 14px; border: 1.5px dashed var(--kb-gray-light); background: var(--kb-white); color: var(--kb-gray); font-family: inherit; font-size: 15px; font-weight: 700; }
.kb-gallery-head { display: flex; align-items: center; gap: 12px; }
.kb-gallery-head .kb-section-title { margin: 0; }
.kb-back-btn { background: none; border: none; font-family: inherit; font-size: 15px; font-weight: 700; color: var(--kb-gray); padding: 6px 4px; }
.kb-gallery-list { display: flex; flex-direction: column; padding: 6px 18px; }
.kb-gallery-item { display: flex; align-items: center; justify-content: space-between; width: 100%; background: none; border: none; border-bottom: 1px solid var(--kb-gray-light); padding: 16px 0; font-family: inherit; font-size: 16px; font-weight: 700; color: var(--kb-ink); }
.kb-gallery-item:last-child { border-bottom: none; }
.kb-gallery-item__arrow { color: var(--kb-gray); font-size: 20px; }

.kb-modal { display: flex; align-items: center; justify-content: center; position: fixed; inset: 0; background: rgba(0,0,0,0.82); z-index: 999; padding: 24px; }
.kb-modal__img { max-width: 100%; max-height: 100%; border-radius: 12px; }
.kb-modal__close { position: absolute; top: 18px; right: 18px; width: 40px; height: 40px; border-radius: 999px; border: none; background: rgba(255,255,255,0.15); color: var(--kb-white); font-size: 18px; font-family: inherit; }

.kb-footer { text-align: center; margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--kb-gray-light); }
.kb-footer__version { font-size: 11.5px; color: var(--kb-gray); font-weight: 700; margin: 0 0 2px; }
.kb-footer__copyright { font-size: 10.5px; color: #B3AEA8; margin: 0; }
`;


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<KangbukApp />);
</script>
</body>
</html>
