/* ------------------------------------------------------------ AWARD CONFIG
   Keep every rule here so week 2 / week 3 rules can swap in later without
   touching calculation or UI logic.                                       */
const AWARD_CONFIG = {
  tiers: [500000, 400000, 300000, 200000, 100000], // highest first
  smallTier: 50000,
  vacationRate: 0.7,
  basicBonusRate: 1.3,
  earlyBonusDates: ["8/3", "8/4", "8/5"],
  lateDates: ["8/6", "8/7"],
  dateOptions: ["8/3", "8/4", "8/5", "8/6", "8/7"],
  highcapBridgeAmounts: { 100000: 500000, 200000: 1000000, 300000: 1500000 },
  highcapAugustMin: 100000,
  mainProductBridgeAmount: 240000,
  mainProductAugustMin: 100000,
};

const TIER_LIST_ASC = [100000, 200000, 300000, 400000, 500000];
const MAX_TIER = 500000;

/* --------------------------------------------------------- PURE HELPERS */
function getHighestTier(perf) {
  for (const t of AWARD_CONFIG.tiers) {
    if (perf >= t) return t;
  }
  return null;
}

function manwon(amountWon) {
  return Math.round(amountWon / 10000) + "만원";
}

// used only when displaying a projected *gain* — never show a misleading negative "increase"
function manwonGain(amountWon) {
  return manwon(Math.max(0, amountWon));
}

function won(amountWon) {
  return amountWon.toLocaleString("ko-KR") + "원";
}

/* ---------------------------------------------------------- CALCULATORS */
function calculateVacationAward(perf) {
  const tier = getHighestTier(perf);
  if (!tier) return { tier: null, amount: 0 };
  return { tier, amount: Math.round(tier * AWARD_CONFIG.vacationRate) };
}

function calculateBasicAward(earlyPerf, latePerf) {
  let earlyAmount = 0;
  if (earlyPerf >= 100000) {
    earlyAmount = Math.round(earlyPerf * AWARD_CONFIG.basicBonusRate);
  } else if (earlyPerf >= AWARD_CONFIG.smallTier) {
    earlyAmount = AWARD_CONFIG.smallTier;
  }

  let lateAmount = 0;
  if (latePerf >= 500000) lateAmount = 500000;
  else if (latePerf >= 400000) lateAmount = 400000;
  else if (latePerf >= 300000) lateAmount = 300000;
  else if (latePerf >= 200000) lateAmount = 200000;
  else if (latePerf >= 100000) lateAmount = 100000;
  else if (latePerf >= AWARD_CONFIG.smallTier) lateAmount = AWARD_CONFIG.smallTier;

  return {
    amount: earlyAmount + lateAmount,
    earlyPerf,
    latePerf,
    earlyAmount,
    lateAmount,
    bonusApplied: earlyPerf >= 100000,
  };
}

function calculateHighcapBridge(julyTier, perf) {
  if (!julyTier) return { eligible: false, achieved: false, amount: 0, gap: 0, julyTier: null };
  const amount = AWARD_CONFIG.highcapBridgeAmounts[julyTier] || 0;
  const achieved = perf >= AWARD_CONFIG.highcapAugustMin;
  const gap = achieved ? 0 : AWARD_CONFIG.highcapAugustMin - perf;
  return { eligible: true, achieved, amount, gap, julyTier };
}

function calculateMainProductBridge(julyAchieved, perf) {
  if (!julyAchieved) return { eligible: false, achieved: false, amount: 0, gap: 0 };
  const amount = AWARD_CONFIG.mainProductBridgeAmount;
  const achieved = perf >= AWARD_CONFIG.mainProductAugustMin;
  const gap = achieved ? 0 : AWARD_CONFIG.mainProductAugustMin - perf;
  return { eligible: true, achieved, amount, gap };
}

// today's real date relative to the fixed 2026-08-03 ~ 08-07 campaign window
function getCampaignPhase() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const d3 = new Date(2026, 7, 3);
  const d5 = new Date(2026, 7, 5);
  const d7 = new Date(2026, 7, 7);
  if (today < d3) return "before";
  if (today <= d5) return "early";
  if (today <= d7) return "late";
  return "ended";
}

function projectAwardSplit(perf, earlyPerf, latePerf, campaignPhase) {
  const vacationAmount = calculateVacationAward(perf).amount;
  const basic = calculateBasicAward(earlyPerf, latePerf);
  return {
    vacation: vacationAmount,
    basic: basic.amount,
    total: vacationAmount + basic.amount,
  };
}

function buildGoalStep(perf, earlyPerf, latePerf, campaignPhase, targetTier, currentTotal, currentVacation, currentBasic) {
  const gap = targetTier - perf;
  const projectedEarlyPerf = campaignPhase === "before" || campaignPhase === "early" ? earlyPerf + gap : earlyPerf;
  const projectedLatePerf = campaignPhase === "late" ? latePerf + gap : latePerf;
  const projectedVacation = calculateVacationAward(targetTier).amount;
  const projectedBasic = calculateBasicAward(projectedEarlyPerf, projectedLatePerf).amount;
  const projectedTotal = projectedVacation + projectedBasic;

  return {
    targetTier,
    gap,
    currentTotal,
    totalEarly: projectedTotal,
    totalLate: projectedTotal,
    deltaEarly: projectedTotal - currentTotal,
    deltaLate: projectedTotal - currentTotal,
    vacationDelta: projectedVacation - currentVacation,
    basicDeltaEarly: projectedBasic - currentBasic,
    basicDeltaLate: projectedBasic - currentBasic,
  };
}

function calculateNextGoals(perf, earlyPerf, latePerf, campaignPhase) {
  const vac = calculateVacationAward(perf);
  const basic = calculateBasicAward(earlyPerf, latePerf);
  const currentTotal = vac.amount + basic.amount;

  const atMax = perf >= MAX_TIER;

  let nearest = null;
  if (!atMax) {
    const nextTier = TIER_LIST_ASC.find((t) => t > perf);
    if (nextTier) {
      nearest = buildGoalStep(perf, earlyPerf, latePerf, campaignPhase, nextTier, currentTotal, vac.amount, basic.amount);
    }
  }

  let challenge = null;
  if (!atMax) {
    challenge = buildGoalStep(perf, earlyPerf, latePerf, campaignPhase, MAX_TIER, currentTotal, vac.amount, basic.amount);
  }

  return { currentTotal, nearest, challenge, atMax };
}

/* --------------------------------------------------------- ORCHESTRATOR */
function computeAll(name, code, earlyPerf, latePerf) {
  const perf = earlyPerf + latePerf;
  const julyTier = HIGHCAP_JULY[code] || null;
  const mainAchievedJuly = MAINPROD_JULY.has(code);

  const vacation = calculateVacationAward(perf);
  const basic = calculateBasicAward(earlyPerf, latePerf);
  const highcap = calculateHighcapBridge(julyTier, perf);
  const mainProduct = calculateMainProductBridge(mainAchievedJuly, perf);
  const campaignPhase = getCampaignPhase();
  const goals = calculateNextGoals(perf, earlyPerf, latePerf, campaignPhase);

  const securedTotal =
    vacation.amount + basic.amount + (highcap.achieved ? highcap.amount : 0) + (mainProduct.achieved ? mainProduct.amount : 0);

  const pendingBridgeTotal =
    (highcap.eligible && !highcap.achieved ? highcap.amount : 0) + (mainProduct.eligible && !mainProduct.achieved ? mainProduct.amount : 0);

  return {
    name,
    perf,
    earlyPerf,
    latePerf,
    julyTier,
    mainAchievedJuly,
    vacation,
    basic,
    highcap,
    mainProduct,
    campaignPhase,
    goals,
    securedTotal,
    pendingBridgeTotal,
  };
}

/* Signature element — tier progress gauge showing the six 실적 구간 */
function TierGauge({ perf }) {
  const boundaries = [0, 50000, 100000, 200000, 300000, 400000, 500000];
  const labels = ["0", "5만", "10만", "20만", "30만", "40만", "50만"];
  const segments = [];
  for (let i = 0; i < boundaries.length - 1; i++) {
    const start = boundaries[i];
    const end = boundaries[i + 1];
    const fillFrac = Math.max(0, Math.min(1, (perf - start) / (end - start)));
    segments.push({ start, end, fillFrac });
  }
  const overallPct = Math.max(0, Math.min(100, (Math.min(perf, MAX_TIER) / MAX_TIER) * 100));

  return (
    <div className="kb-gauge">
      <div className="kb-gauge__track">
        {segments.map((s, i) => (
          <div className="kb-gauge__seg" key={i}>
            <div className="kb-gauge__fill" style={{ width: s.fillFrac * 100 + "%" }} />
          </div>
        ))}
        <div className="kb-gauge__marker" style={{ left: overallPct + "%" }}>
          <Kangbugi size={26} mood={perf >= MAX_TIER ? "cheer" : "default"} />
        </div>
      </div>
      <div className="kb-gauge__labels">
        {labels.slice(1).map((l, i) => (
          <span key={i}>{l}</span>
        ))}
      </div>
    </div>
  );
}

function roundRectPath(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function drawKangbugiOnCanvas(ctx, cx, cy, size) {
  const s = size / 100;
  ctx.save();
  ctx.translate(cx - size / 2, cy - size / 2);
  ctx.fillStyle = "#FFE8D6";
  ctx.beginPath();
  ctx.arc(50 * s, 50 * s, 46 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#FF7A29";
  roundRectPath(ctx, 17 * s, 14 * s, 22 * s, 72 * s, 11 * s);
  ctx.fill();
  roundRectPath(ctx, 61 * s, 14 * s, 22 * s, 72 * s, 11 * s);
  ctx.fill();
  roundRectPath(ctx, 17 * s, 41 * s, 66 * s, 20 * s, 10 * s);
  ctx.fill();
  ctx.fillStyle = "rgba(255,177,153,0.65)";
  ctx.beginPath();
  ctx.ellipse(34.5 * s, 56.5 * s, 5 * s, 3.4 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(65.5 * s, 56.5 * s, 5 * s, 3.4 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#2B2A28";
  ctx.beginPath();
  ctx.arc(40 * s, 49 * s, 4.3 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(60 * s, 49 * s, 4.3 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#FFFFFF";
  ctx.beginPath();
  ctx.arc(41.4 * s, 47.4 * s, 1.2 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(61.4 * s, 47.4 * s, 1.2 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#2B2A28";
  ctx.lineWidth = 3 * s;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(42 * s, 56 * s);
  ctx.quadraticCurveTo(50 * s, 60.5 * s, 58 * s, 56 * s);
  ctx.stroke();
  ctx.restore();
}

function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(" ");
  let line = "";
  let curY = y;
  for (let i = 0; i < words.length; i++) {
    const test = line + words[i] + " ";
    if (ctx.measureText(test).width > maxWidth && line !== "") {
      ctx.fillText(line.trim(), x, curY);
      line = words[i] + " ";
      curY += lineHeight;
    } else {
      line = test;
    }
  }
  ctx.fillText(line.trim(), x, curY);
  return curY;
}

async function generateShareImage(result) {
  const { name, perf, earlyPerf, latePerf, securedTotal, vacation, basic, highcap, mainProduct, goals, campaignPhase } = result;
  const items = [];
  if (vacation.amount > 0) items.push({ label: "⛱️ 휴가비", amount: vacation.amount });
  if (basic.amount > 0) items.push({ label: "💰 기본시상", amount: basic.amount });
  if (highcap.achieved) items.push({ label: "🌉 고하이캡 브릿지", amount: highcap.amount, note: "내년 지급" });
  if (mainProduct.achieved) items.push({ label: "🎯 주력상품 브릿지", amount: mainProduct.amount, note: "내년 지급" });

  const bridgeMaxTotal = (highcap.eligible ? highcap.amount : 0) + (mainProduct.eligible ? mainProduct.amount : 0);
  const stillHasEarlyWindow = campaignPhase === "before" || campaignPhase === "early";
  const maxProj = !goals.atMax
    ? projectAwardSplit(
        MAX_TIER,
        stillHasEarlyWindow ? earlyPerf + (MAX_TIER - perf) : earlyPerf,
        campaignPhase === "late" ? latePerf + (MAX_TIER - perf) : latePerf,
        campaignPhase
      )
    : null;
  const maxTotal = goals.atMax
    ? securedTotal + (highcap.eligible && !highcap.achieved ? highcap.amount : 0) + (mainProduct.eligible && !mainProduct.achieved ? mainProduct.amount : 0)
    : maxProj.total + bridgeMaxTotal;
  const maxDeadlineLabel = campaignPhase === "late" ? "8월 7일(금)" : "8월 5일(수)";
  const gapToMax = goals.atMax ? 0 : MAX_TIER - perf;

  try {
    if (document.fonts) {
      await Promise.all([
        document.fonts.load('900 34px "Noto Sans KR"'),
        document.fonts.load('800 16px "Noto Sans KR"'),
        document.fonts.load('700 15px "Noto Sans KR"'),
        document.fonts.load('500 10px "Noto Sans KR"'),
      ]);
    }
  } catch (e) {
    /* fall back to system font silently */
  }

  const W = 360;
  const scale = 3;
  const pad = 26;
  const itemRowH = 34;
  const listH = items.length ? items.length * itemRowH + 10 : 40;
  const maxSectionH = goals.atMax ? 30 : 68;
  const H = pad + 70 + 44 + 62 + 24 + listH + 20 + maxSectionH + 20 + 50 + pad;

  const canvas = document.createElement("canvas");
  canvas.width = W * scale;
  canvas.height = H * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);

  ctx.fillStyle = "#FFF8F0";
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "#ECE7DF";
  ctx.lineWidth = 1;
  roundRectPath(ctx, 0.5, 0.5, W - 1, H - 1, 20);
  ctx.stroke();

  let y = pad;
  drawKangbugiOnCanvas(ctx, pad + 22, y + 20, 46);
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#C6501A";
  ctx.font = "900 21px 'Noto Sans KR'";
  ctx.fillText("강북이", pad + 52, y + 18);
  ctx.fillStyle = "#8A8580";
  ctx.font = "600 12px 'Noto Sans KR'";
  ctx.fillText("강북지역단 8월 1주차 시상 가이드", pad + 52, y + 36);

  y += 70;
  ctx.fillStyle = "#2B2A28";
  ctx.font = "700 15px 'Noto Sans KR'";
  ctx.fillText(name + "님, 지금 확보하신 예상 시상금은", pad, y);

  y += 44;
  ctx.fillStyle = "#C6501A";
  ctx.font = "900 32px 'Noto Sans KR'";
  ctx.fillText(securedTotal.toLocaleString("ko-KR") + "원", pad, y);

  y += 18;
  ctx.strokeStyle = "#ECE7DF";
  ctx.beginPath();
  ctx.moveTo(pad, y);
  ctx.lineTo(W - pad, y);
  ctx.stroke();

  y += 26;
  if (items.length === 0) {
    ctx.fillStyle = "#8A8580";
    ctx.font = "600 14px 'Noto Sans KR'";
    ctx.textAlign = "left";
    ctx.fillText("아직 확보한 시상이 없어요", pad, y);
    y += itemRowH;
  } else {
    items.forEach((it) => {
      ctx.textAlign = "left";
      ctx.fillStyle = "#2B2A28";
      ctx.font = "700 15px 'Noto Sans KR'";
      ctx.fillText(it.label, pad, y);

      ctx.textAlign = "right";
      ctx.font = "800 15px 'Noto Sans KR'";
      ctx.fillStyle = "#C6501A";
      const amtText = Math.round(it.amount / 10000) + "만원";
      ctx.fillText(amtText, W - pad, y);

      if (it.note) {
        const amtW = ctx.measureText(amtText).width;
        ctx.font = "700 10px 'Noto Sans KR'";
        ctx.fillStyle = "#8A8580";
        ctx.fillText(it.note, W - pad - amtW - 10, y);
      }
      y += itemRowH;
    });
  }

  y += 4;
  ctx.strokeStyle = "#ECE7DF";
  ctx.beginPath();
  ctx.moveTo(pad, y);
  ctx.lineTo(W - pad, y);
  ctx.stroke();

  y += 24;
  ctx.textAlign = "left";
  if (goals.atMax) {
    ctx.fillStyle = "#4C8B5C";
    ctx.font = "700 13px 'Noto Sans KR'";
    ctx.fillText("이번 주 최고 구간(50만원)을 이미 달성하셨어요.", pad, y);
    y += 24;
  } else {
    ctx.fillStyle = "#2B2A28";
    ctx.font = "600 13px 'Noto Sans KR'";
    ctx.fillText("50만원 구간까지 " + gapToMax.toLocaleString("ko-KR") + "원 남았어요.", pad, y);
    y += 22;
    ctx.fillStyle = "#C6501A";
    ctx.font = "700 13px 'Noto Sans KR'";
    ctx.fillText(maxDeadlineLabel + "까지 달성하면 최대 " + maxTotal.toLocaleString("ko-KR") + "원", pad, y);
    y += 24;
  }

  y += 2;
  ctx.strokeStyle = "#ECE7DF";
  ctx.beginPath();
  ctx.moveTo(pad, y);
  ctx.lineTo(W - pad, y);
  ctx.stroke();

  y += 22;
  ctx.fillStyle = "#B3AEA8";
  ctx.font = "500 10px 'Noto Sans KR'";
  ctx.textAlign = "left";
  wrapCanvasText(
    ctx,
    "※ 강북이는 입력하신 실적과 시상 기준을 바탕으로 예상 금액을 안내하는 서비스입니다. 실제 시상금은 최종 실적 및 시상 기준 적용 결과에 따라 달라질 수 있습니다.",
    pad,
    y,
    W - pad * 2,
    14
  );

  return new Promise((resolve) => {
    canvas.toBlob((blob) => resolve(blob), "image/png");
  });
}

        <SectionTitle>{name}님의 전체 시상 현황</SectionTitle>
        <div className="kb-board__grid">
          <span className="kb-board__name">{AWARD_ICON.vacation} 휴가비 시상</span>
          <span className="kb-board__meta">{vacation.tier ? manwon(vacation.tier) + " 구간" : "미달성"}</span>
          <span className="kb-board__amt">{manwon(vacation.amount)}</span>

          <span className="kb-board__name">{AWARD_ICON.basic} 기본 시상</span>
          <span className="kb-board__meta">
            3~5일 {manwon(basic.earlyAmount)} + 6~7일 {manwon(basic.lateAmount)}
          </span>
          <span className="kb-board__amt">{manwon(basic.amount)}</span>

          <span className="kb-board__name">{AWARD_ICON.highcap} 고하이캡 브릿지</span>
          <span className="kb-board__meta">{highcap.eligible ? (highcap.achieved ? "조건 달성" : "조건 미달") : "대상 아님"}</span>
          <span className="kb-board__amt">
            {highcap.achieved && <span className="kb-board__tag">내년 지급</span>}
            {highcap.achieved ? manwon(highcap.amount) : "0원"}
          </span>

          <span className="kb-board__name">{AWARD_ICON.mainprod} 주력상품 브릿지</span>
          <span className="kb-board__meta">{mainProduct.eligible ? (mainProduct.achieved ? "조건 달성" : "조건 미달") : "대상 아님"}</span>
          <span className="kb-board__amt">
            {mainProduct.achieved && <span className="kb-board__tag">내년 지급</span>}
            {mainProduct.achieved ? manwon(mainProduct.amount) : "0원"}
          </span>
        </div>

        <div className="kb-board__total">
          <p className="kb-board__total-label">현재 확보한 예상 시상금</p>
          <p className="kb-board__total-amt">{won(securedTotal)}</p>
          {goals.atMax ? (
            pendingBridgeTotal > 0 && (
              <p className="kb-board__pending">브릿지까지 모두 채우면 최대 {won(securedTotal + pendingBridgeTotal)}</p>
            )
          ) : campaignPhase === "before" || campaignPhase === "early" ? (
            <p className="kb-board__pending">
              8월 5일(수)까지 50만원을 달성하면 최대 {won(maxTierProjection.total + bridgeMaxTotal)}
            </p>
          ) : campaignPhase === "late" ? (
            <p className="kb-board__pending">
              8월 7일(금)까지 50만원을 달성하면 최대 {won(maxTierProjection.total + bridgeMaxTotal)}
            </p>
          ) : (
            pendingBridgeTotal > 0 && (
              <p className="kb-board__pending">브릿지까지 모두 채우면 최대 {won(securedTotal + pendingBridgeTotal)}</p>
            )
          )}
        </div>
      </div>

      <button className="kb-cta kb-cta--secondary" onClick={onRecalculate}>
        다시 계산하기
      </button>

      <button className="kb-cta kb-cta--ghost" onClick={handleSaveImage} disabled={saving}>
        {saving ? "이미지 생성 중..." : "이미지로 저장하기"}
      </button>

      <button className="kb-cta kb-cta--ghost" onClick={handleShareService}>
        카톡으로 강북이 공유하기
      </button>

      <p className="kb-disclaimer">
        ※ 강북이는 입력하신 실적과 시상 기준을 바탕으로 예상 금액을 안내하는 서비스입니다.
        <br />
        실제 시상금은 최종 실적 및 시상 기준 적용 결과에 따라 달라질 수 있습니다.
      </p>
    </div>
  );
}

/* =========================================================================
   APP ROOT
   ========================================================================= */
function KangbukApp() {
  const [step, setStep] = useState("input"); // 'input' | 'result'
  const [name, setName] = useState("");
  const [code, setCode] = useState("");
  const [earlyPerfInput, setEarlyPerfInput] = useState("");
  const [latePerfInput, setLatePerfInput] = useState("");

  const result = useMemo(() => {
    if (step !== "result") return null;
    const earlyPerf = Number(earlyPerfInput.replace(/[^0-9]/g, "")) || 0;
    const latePerf = Number(latePerfInput.replace(/[^0-9]/g, "")) || 0;
    return computeAll(name.trim(), code.trim(), earlyPerf, latePerf);
  }, [step, name, code, earlyPerfInput, latePerfInput]);

  function handleSubmit() {
    setStep("result");
    setTimeout(() => {
      window.scrollTo(0, 0);
    }, 0);
  }

  function handleRecalculate() {
    setStep("input");
  }

  return (
    <div className="kb-app">
      <style>{CSS}</style>
      {step === "input" || !result ? (
        <InputScreen
          name={name}
          setName={setName}
          code={code}
          setCode={setCode}
          earlyPerfInput={earlyPerfInput}
          setEarlyPerfInput={setEarlyPerfInput}
          latePerfInput={latePerfInput}
          setLatePerfInput={setLatePerfInput}
          onSubmit={handleSubmit}
        />
      ) : (
        <ResultScreen result={result} onRecalculate={handleRecalculate} />
      )}
    </div>
  );
}
