function manwon(amountWon) {
  return Math.round(amountWon / 10000) + "만원";
}
function manwonGain(amountWon) {
  return manwon(Math.max(0, amountWon));
}
function won(amountWon) {
  return amountWon.toLocaleString("ko-KR") + "원";
}
function normalizeName(name) {
  return (name || "").replace(/\s+/g, "");
}
function findCodesByName(name) {
  const norm = normalizeName(name);
  if (!norm) return [];
  return ROSTER.filter((p) => normalizeName(p.name) === norm).map((p) => p.code);
}

/* ---------------------------------------------------------- CALCULATORS */
function calculateGiftSmall(perf) {
  return { achieved: perf >= AWARD_CONFIG.giftSmall.minPerf, item: AWARD_CONFIG.giftSmall.item, icon: AWARD_CONFIG.giftSmall.icon };
}

function calculateGiftTier(perf) {
  for (const t of AWARD_CONFIG.giftTiers) {
    if (perf >= t.min) return { achieved: true, min: t.min, item: t.item, icon: t.icon };
  }
  return { achieved: false, min: null, item: null, icon: null };
}

   "정액 ÷ 총실적" 실질 지급률을 적용 (2주차와 동일한 확정 공식, 새 구간/비율만 반영) */
function calculateBasicAward(perf, mainProductPerf, isOverride) {
  const mpPerf = Math.min(mainProductPerf || 0, perf);
  const otherPerf = perf - mpPerf;

  if (isOverride) {
    return { amount: Math.round(perf * AWARD_CONFIG.basicOverrideRate), mode: "override", mainPortion: null, otherPortion: null };
  }
  if (perf < 50000) {
    return { amount: 0, mode: "none", mainPortion: null, otherPortion: null };
  }
  let impliedRate, mode;
  if (perf >= AWARD_CONFIG.basicTopMin) {
    impliedRate = AWARD_CONFIG.basicTopRateOther;
    mode = "top";
  } else {
    const tier = AWARD_CONFIG.basicFixedTiers.find((t) => perf >= t.min && perf < t.max);
    const fixedAmount = tier ? tier.amount : 0;
    impliedRate = fixedAmount / perf;
    mode = "fixed";
  }
  const mainAmt = Math.round(mpPerf * AWARD_CONFIG.basicTopRateMain);
  const otherAmt = Math.round(otherPerf * impliedRate);
  return { amount: mainAmt + otherAmt, mode, mainPortion: mainAmt, otherPortion: otherAmt };
}

function calculateAmchiAward(amchiPerf) {
  for (const t of AWARD_CONFIG.amchiTiers) {
    if (amchiPerf >= t.min && (t.max === undefined || amchiPerf < t.max)) {
      return { amount: t.amount, tierMin: t.min };
    }
  }
  return { amount: 0, tierMin: null };
}

function calculateAmchiChickenBonus(amchiCount) {
  return { achieved: amchiCount >= AWARD_CONFIG.amchiChickenMinCount };
}

/* 2차년도 고하이캡 브릿지 — 8월 3~5주차 + 9월 1~2주차(~11일)에 걸치는 장기 조건이라
   아직 실제 누적 데이터가 없음. 이번 주 입력한 실적을 기준으로 "지금 이대로 유지하면
   어느 구간인지"를 미리 보여주는 예상치이며, 최종 지급은 9월 조건까지 확인해야 함. */
function calculateHighcapBridgeProjection(bridgePerf) {
  let tier = null;
  if (bridgePerf >= 300000) tier = 300000;
  else if (bridgePerf >= 200000) tier = 200000;
  else if (bridgePerf >= 100000) tier = 100000;
  if (!tier) return { eligible: false, tier: null, amount: 0 };
  return { eligible: true, tier, amount: AWARD_CONFIG.highcapBridgeAmounts[tier] };
}

function calculateNextGoal(perf, mainProductPerf, isOverride) {
  if (isOverride) return null;
  const nextBound = BASIC_TIER_BOUNDS.find((b) => b > perf);
  if (!nextBound) return null;
  const gap = nextBound - perf;
  const current = calculateBasicAward(perf, mainProductPerf, false).amount;
  const projected = calculateBasicAward(nextBound, mainProductPerf, false).amount;
  return { targetTier: nextBound, gap, currentAmount: current, projectedAmount: projected, delta: projected - current };
}

/* --------------------------------------------------------- ORCHESTRATOR */
function computeAll(name, code, perf, mainProductPerf, isOverride, amchiPerf, amchiCount, highcapBridgePerf) {
  const giftSmall = calculateGiftSmall(perf);
  const giftTier = calculateGiftTier(perf);
  const basic = calculateBasicAward(perf, mainProductPerf, isOverride);
  const amchi = calculateAmchiAward(amchiPerf);
  const amchiChicken = calculateAmchiChickenBonus(amchiCount);
  const highcapProjection = calculateHighcapBridgeProjection(highcapBridgePerf);
  const nextGoal = calculateNextGoal(perf, mainProductPerf, isOverride);

  const securedTotal = basic.amount + amchi.amount;

  return {
    name,
    code,
    perf,
    mainProductPerf,
    isOverride,
    amchiPerf,
    amchiCount,
    highcapBridgePerf,
    giftSmall,
    giftTier,
    basic,
    amchi,
    amchiChicken,
    highcapProjection,
    nextGoal,
    securedTotal,
  };
}

function TierGauge({ perf }) {
  const boundaries = [0, 50000, 100000, 200000, 300000];
  const labels = ["5만", "10만", "20만", "30만+"];
  const capPerf = Math.min(perf, 300000);
  const segments = [];
  for (let i = 0; i < boundaries.length - 1; i++) {
    const start = boundaries[i];
    const end = boundaries[i + 1];
    const fillFrac = Math.max(0, Math.min(1, (capPerf - start) / (end - start)));
    segments.push({ fillFrac });
  }
  return (
    <div className="kb-gauge">
      <div className="kb-gauge__track">
        {segments.map((s, i) => (
          <div className="kb-gauge__seg" key={i}>
            <div className="kb-gauge__fill" style={{ width: s.fillFrac * 100 + "%" }} />
          </div>
        ))}
      </div>
      <div className="kb-gauge__labels">
        {labels.map((l, i) => (
          <span key={i}>{l}</span>
        ))}
      </div>
    </div>
  );
}

function getGiftAtTarget(targetTier) {
  if (targetTier === 50000) return AWARD_CONFIG.giftSmall.item;
  const t = AWARD_CONFIG.giftTiers.find((g) => g.min === targetTier);
  return t ? t.item : null;
}

function buildChickenBonus(result) {
  const { amchiChicken, amchiCount } = result;
  if (amchiChicken.achieved) return null;
  const remaining = AWARD_CONFIG.amchiChickenMinCount - amchiCount;
  if (remaining <= 0) return null;
  if (amchiCount === 0) {
    return "비암치플랜 3건을 채우시면 교촌치킨 허니 한마리도 받으실 수 있어요!";
  }
  return `비암치플랜 ${remaining}건만 더 하시면 교촌치킨 허니 한마리를 받으실 수 있어요!`;
}

function buildCoachMessage(result) {
  const { name, nextGoal, securedTotal, isOverride } = result;
  const bonus = buildChickenBonus(result);

  if (isOverride) {
    return {
      main: `${name}님, 이번 달 100만원 이상(또는 당월 위촉)으로 실적 전체가 100% 인정돼요!`,
      detail: `지금까지 확보하신 시상금은 ${won(securedTotal)}이에요.`,
      bonus,
    };
  }
  if (!nextGoal) {
    return {
      main: `${name}님, 이미 30만원 구간을 넘으셨어요!`,
      detail: `지금까지 확보하신 시상금은 ${won(securedTotal)}이에요.`,
      bonus,
    };
  }

  const gift = getGiftAtTarget(nextGoal.targetTier);
  const detail = gift
    ? `여기까지 채우시면 기본시상이 ${manwonGain(nextGoal.delta)}이 더 늘어나고, ${gift}도 받으실 수 있어요!`
    : `여기까지 채우시면 기본시상이 ${manwonGain(nextGoal.delta)}이 더 늘어나요.`;

  return {
    main: `${name}님, ${manwon(nextGoal.targetTier)} 구간까지 ${won(nextGoal.gap)} 남았어요.`,
    detail,
    bonus,
  };
}

/* --------------------------------------------------- SHARE IMAGE (canvas) */
function roundRectPath(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function drawKangbugiOnCanvas(ctx, cx, cy, size) {
  try {
    const img = await loadImage(MASCOT_IMAGES.happy);
    const ratio = img.width / img.height;
    const h = size;
    const w = size * ratio;
    ctx.drawImage(img, cx - w / 2, cy - h / 2, w, h);
  } catch (e) {}
}

function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(" ");
  let line = "";
  let curY = y;
  for (let i = 0; i < words.length; i++) {
    const test = line + words[i] + " ";
    if (ctx.measureText(test).width > maxWidth && line !== "") {
      ctx.fillText(line.trim(), x, curY);
      line = words[i] + " ";
      curY += lineHeight;
    } else {
      line = test;
    }
  }
  ctx.fillText(line.trim(), x, curY);
  return curY;
}

async function generateShareImage(result) {
  const { name, securedTotal, basic, amchi, amchiChicken, giftSmall, giftTier } = result;
  const items = [];
  if (basic.amount > 0) items.push({ label: "💰 기본시상", amount: basic.amount });
  if (amchi.amount > 0) items.push({ label: "🩺 비암치플랜", amount: amchi.amount });

  const gifts = [];
  if (giftSmall.achieved) gifts.push(giftSmall.item);
  if (giftTier.achieved) gifts.push(giftTier.item);
  if (amchiChicken.achieved) gifts.push("교촌치킨 허니 한마리");

  try {
    if (document.fonts) {
      await Promise.all([
        document.fonts.load('900 34px "Noto Sans KR"'),
        document.fonts.load('800 16px "Noto Sans KR"'),
        document.fonts.load('700 15px "Noto Sans KR"'),
        document.fonts.load('500 10px "Noto Sans KR"'),
      ]);
    }
  } catch (e) {}

  const W = 360;
  const scale = 3;
  const pad = 26;
  const itemRowH = 34;
  const listH = items.length ? items.length * itemRowH + 10 : 40;
  const giftH = gifts.length ? gifts.length * 20 + 30 : 0;
  const H = pad + 70 + 44 + 62 + 24 + listH + (giftH ? giftH + 10 : 0) + 24 + 50 + pad;

  const canvas = document.createElement("canvas");
  canvas.width = W * scale;
  canvas.height = H * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);

  ctx.fillStyle = "#FFF8F0";
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "#ECE7DF";
  ctx.lineWidth = 1;
  roundRectPath(ctx, 0.5, 0.5, W - 1, H - 1, 20);
  ctx.stroke();

  let y = pad;
  await drawKangbugiOnCanvas(ctx, pad + 22, y + 20, 46);
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#C6501A";
  ctx.font = "900 21px 'Noto Sans KR'";
  ctx.fillText("강북이", pad + 52, y + 18);
  ctx.fillStyle = "#8A8580";
  ctx.font = "600 12px 'Noto Sans KR'";
  ctx.fillText("강북지역단 8월 3주차 시상 가이드", pad + 52, y + 36);

  y += 70;
  ctx.fillStyle = "#2B2A28";
  ctx.font = "700 15px 'Noto Sans KR'";
  ctx.fillText(name + "님, 지금 확보하신 예상 시상금은", pad, y);

  y += 44;
  ctx.fillStyle = "#C6501A";
  ctx.font = "900 32px 'Noto Sans KR'";
  ctx.fillText(securedTotal.toLocaleString("ko-KR") + "원", pad, y);

  y += 18;
  ctx.strokeStyle = "#ECE7DF";
  ctx.beginPath();
  ctx.moveTo(pad, y);
  ctx.lineTo(W - pad, y);
  ctx.stroke();

  y += 26;
  if (items.length === 0) {
    ctx.fillStyle = "#8A8580";
    ctx.font = "600 14px 'Noto Sans KR'";
    ctx.textAlign = "left";
    ctx.fillText("아직 확보한 시상이 없어요", pad, y);
    y += itemRowH;
  } else {
    items.forEach((it) => {
      ctx.textAlign = "left";
      ctx.fillStyle = "#2B2A28";
      ctx.font = "700 15px 'Noto Sans KR'";
      ctx.fillText(it.label, pad, y);
      ctx.textAlign = "right";
      ctx.font = "800 15px 'Noto Sans KR'";
      ctx.fillStyle = "#C6501A";
      const amtText = Math.round(it.amount / 10000) + "만원";
      ctx.fillText(amtText, W - pad, y);
      y += itemRowH;
    });
  }

  if (gifts.length) {
    y += 6;
    ctx.textAlign = "left";
    ctx.fillStyle = "#8A8580";
    ctx.font = "700 11px 'Noto Sans KR'";
    ctx.fillText("사은품", pad, y);
    y += 18;
    gifts.forEach((g) => {
      ctx.fillStyle = "#2B2A28";
      ctx.font = "500 11px 'Noto Sans KR'";
      y = wrapCanvasText(ctx, "· " + g, pad, y, W - pad * 2, 15);
      y += 15;
    });
  }

  y += 4;
  ctx.strokeStyle = "#ECE7DF";
  ctx.beginPath();
  ctx.moveTo(pad, y);
  ctx.lineTo(W - pad, y);
  ctx.stroke();

  y += 22;
  ctx.fillStyle = "#B3AEA8";
  ctx.font = "500 10px 'Noto Sans KR'";
  ctx.textAlign = "left";
  wrapCanvasText(
    ctx,
    "※ 강북이는 입력하신 실적과 시상 기준을 바탕으로 예상 금액을 안내하는 서비스입니다. 실제 시상금은 최종 실적 및 시상 기준 적용 결과에 따라 달라질 수 있습니다.",
    pad,
    y,
    W - pad * 2,
    14
  );

  return new Promise((resolve) => {
    canvas.toBlob((blob) => resolve(blob), "image/png");
  });
}

  const [screen, setScreen] = useState("input"); // 'input' | 'result' | 'gallery' | 'pastResults'
  const [posterKey, setPosterKey] = useState(null);
  const [showSurvey, setShowSurvey] = useState(false);

  const [name, setName] = useState("");
  const [code, setCode] = useState("");
  const [perfAdditionalInput, setPerfAdditionalInput] = useState("");
  const [mainProductInput, setMainProductInput] = useState("");
  const [isOverride, setIsOverride] = useState(false);
  const [amchiPerfInput, setAmchiPerfInput] = useState("");
  const [amchiCountInput, setAmchiCountInput] = useState("");
  const [highcapBridgeAdditionalInput, setHighcapBridgeAdditionalInput] = useState("");

  useEffect(() => {
    window.scrollTo(0, 0);
  }, [screen]);

  useEffect(() => {
    if (posterKey) track("poster_view", { poster: posterKey });
  }, [posterKey]);

  const result = useMemo(() => {
    if (screen !== "result" && screen !== "pastResults") return null;

    const matches = findCodesByName(name);
    let resolvedCode = code.trim().toUpperCase();
    if (matches.length === 1) resolvedCode = matches[0];

    const perfAdditional = Number(perfAdditionalInput.replace(/[^0-9]/g, "")) || 0;
    const perf = getClosingPerf(resolvedCode) + perfAdditional;
    const mainProductPerf = Number(mainProductInput.replace(/[^0-9]/g, "")) || 0;
    const amchiPerf = Number(amchiPerfInput.replace(/[^0-9]/g, "")) || 0;
    const amchiCount = Number(amchiCountInput.replace(/[^0-9]/g, "")) || 0;
    const highcapBridgeAdditional = Number(highcapBridgeAdditionalInput.replace(/[^0-9]/g, "")) || 0;
    const highcapBridgePerf = getHighcapBridgeClosingPerf(resolvedCode) + highcapBridgeAdditional;

    return computeAll(name.trim(), resolvedCode, perf, mainProductPerf, isOverride, amchiPerf, amchiCount, highcapBridgePerf);
  }, [screen, name, code, perfAdditionalInput, mainProductInput, isOverride, amchiPerfInput, amchiCountInput, highcapBridgeAdditionalInput]);

  function handleSubmit() {
    setScreen("result");
  }
  function handleRecalculateClick() {
    setShowSurvey(true);
  }
  function handleSurveyGo() {
    track("survey_interstitial_go");
    window.open(FEEDBACK_FORM_URL, "_blank", "noopener,noreferrer");
    setShowSurvey(false);
    setScreen("input");
  }
  function handleSurveySkip() {
    track("survey_interstitial_skip");
    setShowSurvey(false);
    setScreen("input");
  }

  function getPosterFile(key) {
    if (key === "recruit") return RECRUIT_POSTER.file;
    if (POSTERS[key]) return POSTERS[key].file;
    return null;
  }

  return (
    <div className="kb-app">
      <style>{CSS}</style>
      {screen === "gallery" ? (
        <GalleryScreen onBack={() => setScreen("result")} onOpenPoster={(k) => setPosterKey(k)} />
      ) : screen === "pastResults" && result ? (
        <PastResultsScreen name={result.name} code={result.code} onBack={() => setScreen("result")} />
      ) : screen === "input" || !result ? (
        <InputScreen
          name={name} setName={setName}
          code={code} setCode={setCode}
          perfAdditionalInput={perfAdditionalInput} setPerfAdditionalInput={setPerfAdditionalInput}
          mainProductInput={mainProductInput} setMainProductInput={setMainProductInput}
          isOverride={isOverride} setIsOverride={setIsOverride}
          amchiPerfInput={amchiPerfInput} setAmchiPerfInput={setAmchiPerfInput}
          amchiCountInput={amchiCountInput} setAmchiCountInput={setAmchiCountInput}
          highcapBridgeAdditionalInput={highcapBridgeAdditionalInput} setHighcapBridgeAdditionalInput={setHighcapBridgeAdditionalInput}
          onSubmit={handleSubmit}
        />
      ) : (
        <ResultScreen
          result={result}
          onRecalculate={handleRecalculateClick}
          onOpenGallery={() => setScreen("gallery")}
          onOpenPoster={(k) => setPosterKey(k)}
          onOpenPastResults={() => setScreen("pastResults")}
        />
      )}
      <PosterModal file={getPosterFile(posterKey)} onClose={() => setPosterKey(null)} />
      {showSurvey && <SurveyInterstitial onGoSurvey={handleSurveyGo} onSkip={handleSurveySkip} />}
    </div>
  );
}
